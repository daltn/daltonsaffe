# Photo series. Each series gets its own page at /photos/<slug>/.
#
# Order is by color: pale khaki/green haze -> blue -> near-black with points
# of light -> warm light emerging -> red on teal -> full red. On desktop the
# grid shows two per row, so entries are paired to echo each other.
#
# Fields:
#   title        (required)
#   description  optional paragraph
#   year         optional
#   cover        optional Cloudinary ID for the index page (defaults to the first photo)
#   photos       list of { image, alt, caption }


